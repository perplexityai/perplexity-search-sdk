[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pplx_srch_sdk"
version = "0.2.0"
description = "Perplexity Search SDK for Python — web search and content snippets"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["orjson>=3.9,<4"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://github.com/perplexityai/perplexity-search-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/pplx_srch_sdk"]
# The cdylib is copied in by the build hook; keep it in the wheel even if VCS-ignored.
artifacts = ["src/pplx_srch_sdk/pplx_sdk.abi3.so"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/hatch_build.py"
